<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wobbzy</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: #1f2937;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 24px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            color: #111827;
            letter-spacing: -0.5px;
        }

        #chat-container {
            flex: 1;
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.2s ease;
        }

        .user {
            background: #2563eb;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot {
            background: #ffffff;
            color: #1f2937;
            align-self: flex-start;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 4px;
        }

        .bot p {
            margin: 0 0 8px 0;
        }

        .bot p:last-child {
            margin-bottom: 0;
        }

        .input-area {
            display: flex;
            gap: 10px;
            background: #ffffff;
            padding: 12px 24px;
            border-top: 1px solid #e5e7eb;
        }

        input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        input::placeholder {
            color: #9ca3af;
        }

        button {
            padding: 10px 20px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:active {
            background: #1e40af;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 14px 16px;
            }

            #chat-container {
                padding: 16px 12px;
            }

            .message {
                max-width: 85%;
            }

            .input-area {
                padding: 10px 16px;
            }
        }
		.message {
			max-width: 75%;
			padding: 10px 14px;
			border-radius: 16px;
			line-height: 1.5;
			font-size: 0.95rem;
			animation: fadeIn 0.2s ease;
		}

		.bot {
			background: #fff7ed;
			color: #9a4d00;
			border: 1px solid #fdba74;
			align-self: flex-start;
			border-bottom-left-radius: 4px;
		}
    </style>
</head>

<body>

    <header>
        <h1>Wobbzy</h1>
    </header>

    <div id="chat-container">
        <div id="messages"></div>

        <div class="input-area">
            <input type="text" id="chat" placeholder="Type a message..." autocomplete="off">

            <button id="btn">Send</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
    <script src="{{ url_for('static', filename='main.js') }}"></script>

</body>

</html>
